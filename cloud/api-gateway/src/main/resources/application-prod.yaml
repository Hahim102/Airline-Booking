server:
  port: 5000

spring:
  application:
    name: API-GATEWAY

  data:
    redis:
      host: redis
      port: 6379

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: AUTH-SERVICE
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/api/auth/**

            - id: USER-SERVICE
              uri: lb://USER-SERVICE
              predicates:
                - Path=/api/users/**

            - id: NOTIFICATION-SERVICE
              uri: lb://NOTIFICATION-SERVICE
              predicates:
                - Path=/api/notification/**

            - id: REPORT-SERVICE
              uri: lb://REPORT-SERVICE
              predicates:
                - Path=/api/export/**

            - id: ANALYTICS-SERVICE
              uri: lb://ANALYTICS-SERVICE
              predicates:
                - Path=/api/analytics/**

eureka:
  instance:
    prefer-ip-address: false
    hostname: api-gateway
    instance-id: API-GATEWAY-01

  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://eureka-server:8070/eureka/