  server:
    port: 5002

  spring:
    application:
      name: auth-service

    datasource:
      url: jdbc:oracle:thin:@localhost:1521/ORCL21PDB1
      username: airline_user_db
      password: 123456
      driver-class-name: oracle.jdbc.OracleDriver

    data:
      redis:
        host: localhost
        port: 6379

    cache:
      type: redis

  recaptcha:
    secret: 6Ld7DuEsAAAAAFo2-LAEpbtEdCf3k9CxZTpqxih1
    verify-url: https://www.google.com/recaptcha/api/siteverify

  app:
    auth:
      refresh-cookie:
        secure: false
        same-site: Lax
    jwt:
      access-token-ttl: 900
      refresh-token-ttl: 604800
      refresh-token-grace-period: 30

  eureka:
    instance:
      prefer-ip-address: true

    client:
      fetch-registry: true
      register-with-eureka: true

      service-url:
        defaultZone: "http://localhost:8070/eureka/"
