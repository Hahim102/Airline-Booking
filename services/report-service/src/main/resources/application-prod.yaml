server:
  port: 5005

spring:
  application:
    name: REPORT-SERVICE

  datasource:
    url: jdbc:oracle:thin:@host.docker.internal:1521/ORCL21PDB1
    username: airline_report_db
    password: ${REPORT_DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver

eureka:
  instance:
    prefer-ip-address: false
    hostname: report-service

  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://eureka-server:8070/eureka/